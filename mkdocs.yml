site_name: laneway
site_description: Jira in your terminal and your browser
repo_url: https://github.com/cornedor/laneway
repo_name: cornedor/laneway
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - navigation.instant
    - navigation.footer
    - navigation.sections
    - search.suggest
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle: {icon: material/weather-sunny, name: Light mode}

plugins:
  - search
  - include-markdown

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc: {permalink: true}
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}

nav:
  - Home: index.md
  - Guide:
      - guide/README.md
      - guide/01-first-run.md
      - guide/02-board-and-panel.md
      - guide/03-editing-and-moving.md
      - guide/04-planning-and-reporting.md
      - guide/05-your-day.md
      - guide/06-work-on-an-issue.md
      - guide/07-from-the-shell.md
      - guide/08-make-it-yours.md
      - guide/09-in-the-browser.md
  - Reference:
      - reference/index.md
      - reference/config.md
      - reference/terminal-keys.md
      - reference/browser-keys.md
      - reference/search.md
      - reference/editor.md
      - reference/rules.md
      - reference/cli.md
      - extension-privacy.md
  - Privacy: privacy.md
